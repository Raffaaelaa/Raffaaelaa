name: Gerar Cobrinha
 
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
 
permissions:
  contents: write
 
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ff1493&color_dots=#ffe4ef,#ffc0cb,#ff85c0,#ff69b4,#d6336c
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ff69b4&color_dots=#2a1530,#6a1550,#b0245f,#ff69b4,#ffc0cb
 
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 
